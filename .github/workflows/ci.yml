name: CI

on:
  push:
    branches: [main]
  pull_request:

# main への push では、作り直した生成物を commit して main に push する。push はデプロイキー（secret の GENERATED_DEPLOY_KEY。
# ruleset の bypass に足してある）で行うので、GITHUB_TOKEN は読むだけ
permissions:
  contents: read

# 同じ PR に push し直したら古い実行を止める（main への push は止めず、1 本ずつ回す。待っている古い実行は後の実行に置き換わり、
# 後の実行が全部を作り直す）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 生成物を読まない確認を先に回す（早く落ちる）
      - run: npm run lint
      - run: npm run typecheck
      # 観測値のモデルの予測値の覚え（キーはモデルの入力の hash。中身も hash ごとに分かれるので、前の覚えを戻しても合う）
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/residuals
          key: residuals-${{ hashFiles('packages/core/src/**', 'packages/core/data/**', 'packages/core/scripts/records-data.ts', 'packages/core/scripts/residual-cache.ts') }}
          restore-keys: residuals-
      # PR は生成物を入れない（main の版のまま）。確認の前に作り直す（plan/design-pr-conflicts.md 3.1 節）
      - run: npm run records:minimal
      - run: node tools/git/ci-generated.ts
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - if: github.event_name == 'push'
        run: node tools/git/ci-generated.ts --commit
        env:
          DEPLOY_KEY: ${{ secrets.GENERATED_DEPLOY_KEY }}
