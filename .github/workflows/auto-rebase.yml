name: 衝突の直し

# 自動マージを予約した PR が、main が進んで衝突になったか、足した ID が main と重なったら、main を取り込んで push し直す
# （plan/design-auto-conflict-fix.md。中身は tools/git/auto-rebase.ts）。PR のブランチへの push はデプロイキー（environment の
# main-push の secret の GENERATED_DEPLOY_KEY）で行うので、PR の CI が起きる。PR のブランチの道具を回す prepare のジョブには鍵を
# 渡さず、鍵を持つ push のジョブは main の版の道具と git だけを使う（plan/design-deploy-key-scope.md 2 節）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 1 本ずつ回す。走っている実行は止めない（直している途中で止めない）。待っている古い実行は後の実行に置き換わり、後の実行が全部を見直す
concurrency:
  group: auto-rebase
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      targets: ${{ steps.find.outputs.targets }}
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: find
        run: node tools/git/auto-rebase.ts --find
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # PR のブランチを取り出して、そのブランチの版の records:renumber・pr:prep を回す。鍵も token も渡さない（PR は find が渡す）
  prepare:
    needs: find
    if: needs.find.outputs.targets != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      entries: ${{ steps.prepare.outputs.entries }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # ID の空きはどのブランチも足していない番号から選び、PR のブランチを取り出すので、全部のブランチの履歴を取る
      - run: git fetch --quiet --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
      - run: npm ci
      # pr:prep の records:minimal が使う、観測値のモデルの予測値の覚え（ci.yml と同じキー）。PR のブランチの道具が書いた覚えは
      # main の覚えに入れない（戻すだけで、保存しない）
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/residuals
          key: residuals-${{ hashFiles('packages/core/src/**', 'packages/core/data/**', 'packages/core/scripts/records-data.ts', 'packages/core/scripts/residual-cache.ts') }}
          restore-keys: residuals-
      - id: prepare
        run: node tools/git/auto-rebase.ts --prepare "$RUNNER_TEMP/auto-rebase"
        env:
          PRS: ${{ needs.find.outputs.prs }}
      - uses: actions/upload-artifact@v7
        with:
          name: auto-rebase
          path: ${{ runner.temp }}/auto-rebase
          if-no-files-found: error
          retention-days: 1

  # main の版を取り出しただけの作業ツリーで、prepare の bundle を PR のブランチに push し、コメントする（npm ci もしない）
  push:
    needs: [find, prepare]
    if: needs.prepare.outputs.entries != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    environment: main-push
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: auto-rebase
          path: ${{ runner.temp }}/auto-rebase
      - run: node tools/git/auto-rebase.ts --push "$RUNNER_TEMP/auto-rebase"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.GENERATED_DEPLOY_KEY }}
          TARGETS: ${{ needs.find.outputs.targets }}
