# Stage 14: Web 版（Stage 16 で apps/calc → apps/web）を GitHub Pages に配信する（plan/design-stage12.md 4.1 節）。CI（ci.yml）とは別。
# base はリポジトリ名のサブパス（https://<owner>.github.io/<repo>/）。ビルドの出力は check-pages-build.ts で確かめる。
# 配信（deploy）はリポジトリが公開のときだけ行う。非公開のあいだはビルドと確認だけ通す。
# 初回は リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
# main の CI（ci.yml）が通った後に回す。画面が読む生成物（data/skills/support.json）を CI がマージの後に作り直して commit するので、
# それを含む main の先頭を配る（CI の push は GITHUB_TOKEN なので、push では Pages が起きない。plan/design-pr-conflicts.md 3.1 節）。
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 書き込みの権限は配信（deploy）のジョブだけに渡す
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.BASE_PATH }}
      - run: node apps/web/scripts/check-pages-build.ts apps/web/dist "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
