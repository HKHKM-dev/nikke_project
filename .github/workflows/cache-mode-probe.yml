name: cache-mode probe (temporary)
on:
  push:
    branches: [claude/deploy-key-cache]
permissions:
  contents: read
jobs:
  read-mode:
    runs-on: ubuntu-latest
    cache-mode: read
    steps:
      - run: echo probe > probe.txt; env | grep -i '^ACTIONS_CACHE' || echo 'no ACTIONS_CACHE* in run env'
      # v4 は ACTIONS_CACHE_MODE を見ない（書けるかはサーバーが決める）
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: probe.txt
          key: probe-read-v4-${{ github.run_id }}
      - uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: probe.txt
          key: probe-read-v6-${{ github.run_id }}
  write-mode:
    runs-on: ubuntu-latest
    steps:
      - run: echo probe > probe.txt
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: probe.txt
          key: probe-write-v4-${{ github.run_id }}
  verify:
    needs: [read-mode, write-mode]
    runs-on: ubuntu-latest
    steps:
      - id: r4
        uses: actions/cache/restore@v4
        with: { path: probe.txt, key: 'probe-read-v4-${{ github.run_id }}', lookup-only: true }
      - id: r6
        uses: actions/cache/restore@v4
        with: { path: probe.txt, key: 'probe-read-v6-${{ github.run_id }}', lookup-only: true }
      - id: w4
        uses: actions/cache/restore@v4
        with: { path: probe.txt, key: 'probe-write-v4-${{ github.run_id }}', lookup-only: true }
      - run: echo "RESULT read-v4=${{ steps.r4.outputs.cache-hit }} read-v6=${{ steps.r6.outputs.cache-hit }} write-v4=${{ steps.w4.outputs.cache-hit }}"
